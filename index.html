<!doctype html>
<!--
  天浩佛堂 — LINE 線上報名頁（放在 GitHub Pages，LIFF 打開的就是這一頁）

  要改的只有下面 <script> 開頭的兩個常數：
    LIFF_ID  LINE Developers → LINE Login channel → LIFF 分頁上的 ID
    API_URL  Apps Script「部署 → 網頁應用程式」給的網址（結尾 /exec）
  兩者都不是祕密：這一頁本來就是公開的，真正的門在 Apps Script 驗 LINE 身分那一步。

  ⚠️ 不要用 Apps Script 直接產生這一頁：它的網頁包在 Google 另一個網域的
     iframe 裡，LIFF 會因為網址對不上而登入失敗。
  ⚠️ 送資料用 Content-Type: text/plain——Apps Script 不回 CORS 預檢，
     用 application/json 會被瀏覽器擋下。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天浩佛堂 課程報名</title>
<!-- LINE 貼連結時的預覽卡片（2026-10-05）。LINE 只讀原始 HTML、不跑 JS，所以抓不到
     課程名稱（那是打開後才向 Sheet 查的）——沒有這幾行時，卡片會顯示表單上的固定文字。
     課程名稱改由佛堂系統「複製報名訊息」放在貼出去的文字裡。 -->
<meta name="description" content="點開連結，填寫姓名與電話即可完成報名。">
<meta property="og:title" content="天浩佛堂 課程報名">
<meta property="og:description" content="點開連結，填寫姓名與電話即可完成報名。">
<meta property="og:type" content="website">
<style>
  :root { --bg:#faf8f4; --card:#fff; --text:#24292f; --muted:#6b7280;
          --primary:#007acc; --ok:#1a7f37; --danger:#cf222e; --border:#dfe3e8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
         background:var(--bg); color:var(--text); font-size:17px; line-height:1.6; }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.92rem; }
  label { display:block; margin-top:16px; font-weight:600; }
  input { width:100%; margin-top:6px; padding:12px; font-size:17px;
          border:1px solid var(--border); border-radius:8px; }
  button { width:100%; margin-top:24px; padding:14px; font-size:18px; border:none;
           border-radius:8px; background:var(--primary); color:#fff; }
  button:disabled { opacity:.5; }
  .done { color:var(--ok); font-size:1.15rem; font-weight:600; }
  .session { margin-top:12px; padding:10px 12px; background:var(--bg); border-radius:8px; }
  .session b { display:block; }
  .agenda { margin:4px 0 0; padding:0; list-style:none; font-size:.95rem; }
  .agenda span { color:var(--muted); display:inline-block; min-width:3.2em; }
  .error { color:var(--danger); }
  .who { border:none; margin:16px 0 0; padding:0; }
  .who legend { font-weight:600; padding:0; }
  .who .choice { font-weight:400; margin-top:8px; display:flex; align-items:center; gap:10px; }
  .who .choice input { width:22px; height:22px; margin:0; flex:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <p id="loading" class="muted">讀取中…</p>

    <div id="form-box" hidden>
      <h1 id="class-name"></h1>
      <p class="muted">天浩佛堂 課程報名<span id="class-location"></span></p>
      <div id="class-sessions"></div>
      <form id="form">
        <!-- 2026-10-05：「本人」的報名佛堂才會記住這個 LINE 是誰，下次直接認得；
             幫家人報名的永遠不記（不然長輩的課會被掛到子女身上） -->
        <fieldset class="who">
          <legend>這個 LINE 是你本人的嗎？</legend>
          <label class="choice"><input type="radio" name="is_self" value="1" required>
            是，我幫自己報名</label>
          <label class="choice"><input type="radio" name="is_self" value="0">
            不是，我幫家人或朋友報名</label>
        </fieldset>
        <label>姓名 <span class="muted" id="name-hint">（上課的人）</span>
          <input id="name" name="name" required maxlength="40" autocomplete="name">
        </label>
        <label>電話
          <input id="phone" name="phone" required inputmode="tel" autocomplete="tel"
                 placeholder="0912345678">
        </label>
        <!-- 2026-10-05：與佛堂紙本「課程報名表」同樣三類，和接駁車一起問 -->
        <fieldset class="who">
          <legend>報名類別</legend>
          <label class="choice"><input type="radio" name="role" value="adult" required> 成人參班</label>
          <label class="choice"><input type="radio" name="role" value="child"> 兒童參班</label>
          <label class="choice"><input type="radio" name="role" value="service"> 服務（佛堂志工協助周邊服務）</label>
        </fieldset>
        <fieldset class="who">
          <legend>需要搭乘接駁車嗎？</legend>
          <label class="choice"><input type="radio" name="shuttle" value="1" required> 需要</label>
          <label class="choice"><input type="radio" name="shuttle" value="0"> 不需要</label>
        </fieldset>
        <p id="form-error" class="error" hidden></p>
        <button type="submit" id="submit">我要報名</button>
      </form>
      <p class="muted" style="margin-top:16px">
        資料只用於這門課的報名與聯絡。下次報名會自動帶出你這次填的姓名電話。
      </p>
    </div>

    <div id="result" hidden>
      <p id="result-text"></p>
      <button type="button" id="close">關閉</button>
    </div>
  </div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  var LIFF_ID = '2011847734-qRuwSyT2';
  var API_URL = 'https://script.google.com/macros/s/AKfycbwmdB4QGjZb_NC0ZolYtl3aiNEV1CVf_TpVETfgGv2JBH7P6YVBhgoOsFv-6jTlre8B/exec';

  var $ = function (id) { return document.getElementById(id); };
  var code = '';
  var idToken = '';

  function api(action, payload) {
    var body = Object.assign({action: action}, payload || {});
    return fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  // 「2026-11-21 09:00 ～ 17:00」：同一天不重複日期
  function span(s) {
    var text = (s.start_date || '') + (s.start_time ? ' ' + s.start_time : '');
    var endDay = s.end_date && s.end_date !== s.start_date ? s.end_date + ' ' : '';
    if (endDay || s.end_time) { text += ' ～ ' + endDay + (s.end_time || ''); }
    return text;
  }

  // 各場次的時間與流程表（佛堂系統按「開放」或「更新報名頁資訊」時送來的）
  function renderInfo(info) {
    info = info || {};
    if (info.location) { $('class-location').textContent = '｜' + info.location; }
    var box = $('class-sessions');
    (info.sessions || []).forEach(function (s, i) {
      var div = document.createElement('div');
      div.className = 'session';
      var title = document.createElement('b');
      title.textContent = (info.sessions.length > 1 ? '第 ' + (i + 1) + ' 場　' : '') + span(s);
      div.appendChild(title);
      if (s.agenda && s.agenda.length) {
        var ul = document.createElement('ul');
        ul.className = 'agenda';
        s.agenda.forEach(function (a) {
          var li = document.createElement('li');
          var t = document.createElement('span');
          t.textContent = a.at_time || '';
          li.appendChild(t);
          li.appendChild(document.createTextNode(a.content));   // 一律當文字，不當 HTML
          ul.appendChild(li);
        });
        div.appendChild(ul);
      }
      box.appendChild(div);
    });
  }

  function show(message, ok) {
    $('loading').hidden = true;
    $('form-box').hidden = true;
    $('result').hidden = false;
    $('result-text').textContent = message;
    $('result-text').className = ok ? 'done' : 'error';
  }

  // 預填的是這個 LINE 本人上次填的資料；改選「幫家人報名」時清掉，免得送出本人的姓名
  var mine = {name: '', phone: ''};
  Array.prototype.forEach.call(document.querySelectorAll('input[name="is_self"]'), function (r) {
    r.addEventListener('change', function () {
      var self = r.value === '1';
      if (!self && $('name').value === mine.name && $('phone').value === mine.phone) {
        $('name').value = ''; $('phone').value = '';
      } else if (self && !$('name').value && !$('phone').value) {
        $('name').value = mine.name; $('phone').value = mine.phone;
      }
    });
  });

  $('close').addEventListener('click', function () {
    if (liff.isInClient()) { liff.closeWindow(); } else { window.close(); }
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('submit').disabled = true;
    $('submit').textContent = '送出中…';
    var picked = function (name) {
      var el = document.querySelector('input[name="' + name + '"]:checked');
      return el ? el.value : '';
    };
    api('signup', {idToken: idToken, code: code, is_self: picked('is_self'),
                   role: picked('role'), shuttle: picked('shuttle'),
                   name: $('name').value, phone: $('phone').value})
      .then(function (res) {
        if (res.ok) { show(res.message, true); return; }
        // 欄位問題留在表單上讓他改；其他問題直接顯示
        if (/姓名|電話/.test(res.message || '')) {
          $('form-error').textContent = res.message;
          $('form-error').hidden = false;
          $('submit').disabled = false;
          $('submit').textContent = '我要報名';
        } else {
          show(res.message || '報名失敗，請稍後再試', false);
        }
      })
      .catch(function () {
        show('網路不穩，報名沒有送出。請稍後重新打開連結再試一次。', false);
      });
  });

  // LINE 的 SDK 沒載進來（網路不穩、被擋）時不要永遠停在「讀取中…」
  if (typeof liff === 'undefined') {
    show('LINE 元件載入失敗，請確認網路後重新打開報名連結。', false);
    throw new Error('LIFF SDK 未載入');
  }

  liff.init({liffId: LIFF_ID}).then(function () {
    if (!liff.isLoggedIn()) {           // 在 LINE 外面打開（例如電腦瀏覽器）時先登入
      liff.login({redirectUri: location.href});
      return;
    }
    code = new URLSearchParams(location.search).get('class') || '';
    idToken = liff.getIDToken();
    if (!code) { show('這個連結少了課程代碼，請向承辦人要正確的報名連結。', false); return; }

    return Promise.all([api('class', {code: code}), api('me', {idToken: idToken})])
      .then(function (results) {
        var klass = results[0], me = results[1];
        if (!klass.ok) { show(klass.message, false); return; }
        if (!klass.open) { show('「' + klass.name + '」報名已截止。', false); return; }
        $('class-name').textContent = klass.name;
        renderInfo(klass.info);
        if (me.ok) {
          mine = {name: me.name || '', phone: me.phone || ''};
          $('name').value = mine.name; $('phone').value = mine.phone;
        }
        $('loading').hidden = true;
        $('form-box').hidden = false;
      });
  }).catch(function (err) {
    show('無法開啟報名頁（' + (err && err.message || err) + '）。請從 LINE 裡重新點報名連結。', false);
  });
</script>
</body>
</html>
